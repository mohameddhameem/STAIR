[project]
name = "stair-common"
version = "0.4.0"
description = "STAIR team standard: frozen splits (with the HotpotQA SLR golden set), scoring, AgentTTS units and Table 5 prices, and the results layout"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.0"]

[project.optional-dependencies]
test = ["pytest>=8", "pyarrow>=15"]
plot = ["matplotlib>=3.8"]

[project.scripts]
stair-plot-history = "stair_common.training:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["stair_common"]

[tool.setuptools.package-data]
stair_common = ["models.toml", "splits/MANIFEST.json", "splits/*/*.txt"]
