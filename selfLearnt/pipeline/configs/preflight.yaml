# PREFLIGHT: every job of the full run, with the real models on the real GPUs, but on a handful of questions.
# Training uses the LONGEST examples first and real context lengths, so memory and disk limits show up within minutes.
# One submission, ~3-6 h depending on free GPUs:   python jobs/submit_all.py --as-job --config configs/preflight.yaml
# Afterwards delete its folder (fine-tuned copies, ~60 GB):   rm -rf $STAIR_RUNS_DIR/preflight
include: default.yaml
run_name: preflight
preflight: true
paths:
  results_dir: ${project_dir}/preflight_results_common   # keep preflight tables out of the repo
data:
  limit: {val: 40, test: 20, train: 40}
  n_search: 10
finetune:
  defaults: {max_epochs: 1, evals_per_epoch: 1, n_val_loss: 4, n_val_metric: 4, save_every_questions: 16}
  retrievers:
    q05: {method: lora, n_train: 16, max_epochs: 1}
    q08: {method: lora, n_train: 16, max_epochs: 1}
    q15: {method: lora, n_train: 16}
    q3:  {method: lora, n_train: 16}
    q7:  {method: lora, n_train: 16}
    q32: {method: qlora, n_train: 16, n_val_loss: 4, n_val_metric: 4}
    q72: {method: qlora, n_train: 16, n_val_loss: 4, n_val_metric: 4}
  answerers:
    l1:  {method: lora, n_train: 16, max_epochs: 1}
    l3:  {method: lora, n_train: 16}
    l8:  {method: lora, n_train: 16}
    l70: {method: qlora, n_train: 16, n_val_loss: 4, n_val_metric: 4}
workstreams:
  ws1:
    iterations: 1
    batch_size: 4
    grid:
      retrieval: {q7: [1, 2], q32: [1], q72: [1]}
      answer: {l3: [1, 3], l8: [1], l70: [1]}
rules:
  rounds: 1
  random_control_draws: 2
