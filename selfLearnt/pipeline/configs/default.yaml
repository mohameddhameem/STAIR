# STAIR / self-learnt switching (track "selfLearnt"): full-scale configuration on the team standard (STAIR common/).
# Six experiments (AL-01 .. AL-06) share one set of question files, models and saved outputs (see README.md).
# Set STAIR_PROJECT_DIR to storage with ~600 GB free (models ~500 GB). Everything else is the design as agreed.

run_name: full_v1
backend: vllm                   # vllm | mock (mock = fake models, for the CPU dry run)
seed: 0                         # run seed (team standard: 0, 1, 2); override with run.py --seed

paths:
  project_dir: ${STAIR_PROJECT_DIR}             # environment variable, e.g. export STAIR_PROJECT_DIR=/scratch/<you>/stair
  models_dir: ${project_dir}/models
  data_dir: ${project_dir}/runs/${run_name}/data
  runs_dir: ${project_dir}/runs
  hf_cache: ${project_dir}/hf_cache
  results_dir: results/common                  # shared results CSVs and training histories (relative to the repo root)

download_models: true           # false if jobs cannot reach the internet: run the setup stage on the login node instead

gpu:
  max_model_len: 20480          # 100 candidate passages are ~13-16k tokens
  gpu_util: 0.90
  chunk: 128                    # prompts per vLLM call; outputs are saved after every chunk (jobs resume from there)

progress:
  github: false                 # true: push a status page to the branch below (needs GITHUB_TOKEN, see README)
  repo: https://github.com/mohameddhameem/STAIR.git
  branch: selfLearnt-runs       # one commit, replaced at every update: the branch never grows
  every_minutes: 20
  author_name: Andy-TaiHL
  author_email: Andy-TaiHL@users.noreply.github.com

# Team splits (stair_common.splits, seed 20260729): test = AgentTTS's 500 (dev[500:1000]); val = dev[0:500], used to
# pick checkpoints (validation loss), learn rules and fit probes; train = 12,000 drawn from the official train file.
# AgentTTS's 50 search questions are dev[0:50], the first 50 of val.
data:
  dataset: hotpotqa
  hotpot_dev: ${project_dir}/hotpotqa/hotpot_dev_distractor_v1.json
  hotpot_dev_url: http://curtis.ml.cmu.edu/datasets/hotpot/hotpot_dev_distractor_v1.json
  hotpot_train: ${project_dir}/hotpotqa/hotpot_train_v1.1.json
  hotpot_train_url: http://curtis.ml.cmu.edu/datasets/hotpot/hotpot_train_v1.1.json
  train_source: train           # train: the official train file; dev: the dev file (dry run, with train_part: train_extra)
  train_part: train             # stair_common split part used for fine-tuning
  n_retrieve: 100               # BM25 paragraphs added to the gold ones (AgentTTS: 100)
  n_search: 50                  # AgentTTS's search questions: the first 50 of val (dev[0:50])
  seed: 7                       # shuffles the candidate order inside each question (not a split)

# ---------------------------------------------------------------------------------
# Models: every entry is a pinned copy from stair_common/models.toml (repo + revision + nominal size); `toml` says which.
# Cost uses the nominal size (AgentTTS units). train_hf_id = full-precision copy for 4-bit (QLoRA) training of the AWQ models.
models:
  nj:  {toml: B.retriever.nano-jev-33M, label: nano-jev 33M, kind: ranker, top_k: 5}
  q05: {toml: B.retriever.Qwen2.5-0.5B, label: Qwen2.5 0.5B}
  q08: {toml: B.retriever.Qwen3.5-0.8B, label: Qwen3.5 0.8B, no_thinking: true}
  q15: {toml: B.retriever.Qwen2.5-1.5B, label: Qwen2.5 1.5B}
  q3:  {toml: B.retriever.Qwen2.5-3B, label: Qwen2.5 3B}
  q7:  {toml: A.retriever.Qwen2.5-7B, label: Qwen2.5 7B}
  q32: {toml: A.retriever.Qwen2.5-32B, label: Qwen2.5 32B, tensor_parallel: 2}       # 16-bit, ~65 GB: both GPUs (1 on an 80 GB H100)
  q72: {toml: A.retriever.Qwen2.5-72B, label: Qwen2.5 72B, tensor_parallel: 2, train_toml: training.qlora.Qwen2.5-72B}
  l1:  {toml: B.answerer.Llama-3.2-1B, label: Llama 3.2 1B, max_model_len: 65536}
  l3:  {toml: A.answerer.Llama-3.2-3B, label: Llama 3.2 3B, max_model_len: 65536}
  l8:  {toml: A.answerer.Llama-3.1-8B, label: Llama 3.1 8B, max_model_len: 65536}
  l70: {toml: A.answerer.Llama-3.1-70B, label: Llama 3.1 70B, tensor_parallel: 2, max_model_len: 49152, train_toml: training.qlora.Llama-3.1-70B}

# Fine-tuning (backpropagation). lora = bf16 LoRA, merged afterwards; qlora = 4-bit base + LoRA, served as a LoRA adapter.
# Early stopping (team standard): validation loss on val every half epoch; stop after `patience` evaluations without
# improvement; keep the best. max_epochs by size: <= 1B: 3; 1.5-14B: 2; 24-72B (QLoRA, 2,000 questions): 2.
finetune:
  defaults: {r: 16, alpha: 32, dropout: 0.05, lr: 1.0e-4, grad_accum: 8, micro_batch: 1, max_epochs: 2, evals_per_epoch: 2, patience: 2,
             n_val_loss: 300, n_val_metric: 100, save_every_questions: 500}
  retrievers:
    q05: {method: lora, n_train: 12000, max_epochs: 3, max_len: 20480}
    q08: {method: lora, n_train: 12000, max_epochs: 3, max_len: 20480}
    q15: {method: lora, n_train: 12000, max_len: 20480}
    q3:  {method: lora, n_train: 12000, max_len: 20480}
    q7:  {method: lora, n_train: 12000, max_len: 20480}
    q32: {method: qlora, n_train: 2000, max_len: 12288, n_val_loss: 150, n_val_metric: 50, gpus: 2}
    q72: {method: qlora, n_train: 2000, max_len: 10240, n_val_loss: 150, n_val_metric: 50, gpus: 4}
  answerers:
    l1:  {method: lora, n_train: 12000, max_epochs: 3, max_len: 4096, micro_batch: 4}
    l3:  {method: lora, n_train: 12000, max_len: 4096, micro_batch: 4}
    l8:  {method: lora, n_train: 12000, max_len: 4096, micro_batch: 4}
    l70: {method: qlora, n_train: 2000, max_len: 4096, n_val_loss: 150, n_val_metric: 50, gpus: 4}
  answer_inputs: {distractors: [0, 2], drop_gold_share: 0.15}   # answerer training: gold passages + 0-2 distractors; sometimes one gold missing

planner: q72                    # LLM for AgentTTS's search (replaces o3-mini) and for proposing rule changes

# ---------------------------------------------------------------------------------
workstreams:
  ws1:
    exp_id: AL-01
    menu: A
    name: "Baseline 1: AgentTTS (original method)"
    kind: agenttts
    retrievers: [q7, q32, q72]
    answerers: [l3, l8, l70]
    budget: 900                 # AgentTTS's default for retrieval QA: one pass of the largest models (814 + 115 = 929), rounded
    np_nd: {Retrieval: [2048, 128], "Question Answering": [256, 64]}
    iterations: 5               # AgentTTS defaults: 5 rounds x 10 candidates (+ initial trials) = ~50 trials
    batch_size: 10
    grid:                       # sample counts evaluated on the search questions (AgentTTS looks the nearest one up)
      retrieval: {q7: [1, 2, 3, 5, 10, 20, 40, 60], q32: [1, 2, 3, 5, 10, 20], q72: [1, 2]}
      answer: {l3: [1, 3, 5, 10, 20, 30, 40, 60], l8: [1, 3, 5, 10, 20, 30, 40, 60], l70: [1, 3, 5, 10, 20, 30]}
    also_test: [[q72, 1, l3, 40]]   # AgentTTS's reported best HotpotQA setting (their code comments), for reference
  ws2:
    exp_id: AL-02
    menu: A
    name: "Baseline 2: strongest models on every question"
    kind: strong
    config: [q72, 1, l70, 1]    # AgentTTS's pipeline with the largest retriever and answerer, one sample each
  ws3:
    exp_id: AL-03
    menu: A
    name: "Hidden-state probe + calibrated rules (AgentTTS's models, untrained)"
    kind: rules
    retrievers: [q7, q32, q72]          # untrained, AgentTTS's retrieval prompt, one greedy pass
    answerers: [l3, l8, l70]            # untrained, step-by-step short answer
    signals: [ret_probe_pct, ans_probe_pct, is_cannot, rung]
    seed_rules:
      - {id: H1, stage: retrieval, hard: true, at: [0], when: [[ret_probe_pct, "<", 0.10]], then: escalate, text: "IF the first retriever's probe score is in its lowest 10% THEN escalate (locked)"}
      - {id: R1, stage: retrieval, when: [[ret_probe_pct, "<", 0.25]], then: escalate, text: "IF the probe says this shortlist is likely incomplete (lowest 25%) THEN escalate to the next retriever and ensemble"}
      - {id: H2, stage: answer, hard: true, when: [[is_cannot, "==", 1]], then: escalate, text: "IF the answer is empty or says it cannot be determined THEN escalate (locked)"}
      - {id: A1, stage: answer, when: [[ans_probe_pct, "<", 0.30]], then: escalate, text: "IF the probe says the answer is likely wrong (lowest 30%) THEN escalate to the next answerer"}
  ws4:
    exp_id: AL-04
    menu: A
    name: "Our fine-tuning + self-learnt rules (AgentTTS's models)"
    kind: rules
    retrievers: ["q7:ft", "q32:ft", "q72:ft"]
    answerers: ["l3:ft", "l8:ft", "l70:ft"]
    signals: all
    seed_rules: &ft_rules
      - {id: H1, stage: retrieval, hard: true, at: [0], when: [[ret_conf_pct, "<", 0.10]], then: escalate, text: "IF the first retriever's confidence is in its lowest 10% THEN escalate retrieval (locked)"}
      - {id: R1, stage: retrieval, at: [0], when: [[ret_conf_pct, "<", 0.20]], then: escalate, skip: 1, text: "IF the first retriever is unsure (lowest 20%) THEN escalate, skipping one size, and ensemble"}
      - {id: R2, stage: retrieval, when: [[rung, ">=", 1], [ret_agree, "==", 0], [ret_conf_pct, "<", 0.20]], then: escalate, text: "IF after escalating the shortlists disagree AND the bigger retriever is also unsure THEN escalate again and ensemble"}
      - {id: H2, stage: answer, hard: true, when: [[is_cannot, "==", 1]], then: escalate, text: "IF the answer is empty or says it cannot be determined THEN escalate (locked)"}
      - {id: A2, stage: answer, when: [[is_yes_no, "==", 1]], then: keep, text: "IF the answer is yes/no THEN keep it"}
      - {id: A1, stage: answer, when: [[words_in_passages, "<", 0.97]], then: escalate, text: "IF some of the answer's words are not in the passages THEN escalate; agree -> accept, else vote"}
      - {id: A3, stage: answer, when: [[ans_conf_pct, "<", 0.15]], then: escalate, text: "IF the answerer's token confidence is in its lowest 15% THEN escalate"}
  ws5:
    exp_id: AL-05
    menu: B
    name: "Our fine-tuning + self-learnt rules (full ladders, from nano-jev 33M)"
    kind: rules
    retrievers: [nj, "q05:ft", "q08:ft", "q15:ft", "q3:ft", "q7:ft", "q32:ft", "q72:ft"]
    answerers: ["l1:ft", "l3:ft", "l8:ft", "l70:ft"]
    signals: all
    seed_rules: *ft_rules
  ws6:
    exp_id: AL-06
    menu: B
    name: "Control: full ladders from the fine-tuned Qwen 0.5B (no nano-jev)"
    kind: rules
    retrievers: ["q05:ft", "q08:ft", "q15:ft", "q3:ft", "q7:ft", "q32:ft", "q72:ft"]
    answerers: ["l1:ft", "l3:ft", "l8:ft", "l70:ft"]
    signals: all
    seed_rules: *ft_rules

# ---------------------------------------------------------------------------------
# Rulebook learning (AL-03 .. AL-06). Rules are learnt on val (halves A and B), tested once on test.
rules:
  rounds: 4
  random_control_draws: 10
  max_ret_members: 3            # retrievers run per question at most (outputs are saved for every such chain)
  answer_samples: 4             # sampled answers saved per shortlist for every answerer above the first (votes)
  params: {votes: 2, sure_threshold: 0.90, merge: union}
  hard:                         # LOCKED: the micro-experiments can never change these (only a person editing this file)
    H3_max_share_top_answerer: 0.60         # at most 60% of questions reach the largest answerer
    H3b_max_share_top_retriever: 0.60       # ... and the largest retriever: never 'always the biggest'
    H4_max_acc_drop_vs_best_fixed: 0.01     # dev accuracy >= best fixed pipeline costing no more - 1 point (below: repair mode)
    H5_min_sure_score: 0.85                 # 'Sure' needs a calibrated score >= 0.85
    H6_max_soft_rules: 8
    H6_min_support_share: 0.02              # each escalate rule decides on >= 2% of dev questions
    H7_max_step: 0.05                       # a threshold moves <= 0.05 per round (percentile / 0-1 units; 1 word = 0.05)
    H8_max_compute_per_point: 0.10          # an accuracy gain may cost <= 10% extra compute per point

# Planned hours per stage on 2 GPUs (A40/L40S class), for the progress page until real rates are measured
estimates_hours: {setup: 3, data: 0.5, train: 55, ws1_grid: 10, ws1_search: 2, ws1_test: 4, retrieve: 12, probe: 5, answer: 12, sample: 6,
                  learn: 2, test: 0.5, report: 0.2}
