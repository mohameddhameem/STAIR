# Dry run on CPU: fake models (backend: mock), a tiny model for training, small question sets; tests every stage in minutes.
# Uses the HotpotQA dev file for every set (downloaded once, ~45 MB).  python run.py --config configs/dryrun.yaml --stage all
run_name: dryrun
backend: mock
paths:
  project_dir: ./dryrun_workspace
  models_dir: ${project_dir}/models
  data_dir: ${project_dir}/data/hotpotqa_${run_name}
  runs_dir: ${project_dir}/runs
  hf_cache: ${project_dir}/hf_cache
download_models: false
gpu:
  max_model_len: 8192
  gpu_util: 0.88
  chunk: 256
data:
  hotpot_train: ${project_dir}/hotpotqa/hotpot_dev_distractor_v1.json
  hotpot_train_url: http://curtis.ml.cmu.edu/datasets/hotpot/hotpot_dev_distractor_v1.json
  hotpot_dev: ${project_dir}/hotpotqa/hotpot_dev_distractor_v1.json
  hotpot_dev_url: http://curtis.ml.cmu.edu/datasets/hotpot/hotpot_dev_distractor_v1.json
  level: hard
  n_candidates: 20
  seed: 7
  n_train: 60
  n_val: 8
  n_dev: 160
  test_seed: 43
  n_test: 120
models:
  q05:
    hf_id: Qwen/Qwen2.5-0.5B-Instruct
    dir: Qwen2.5-0.5B-Instruct
    params: 0.49e9
    label: Qwen2.5 0.5B
  q06:
    hf_id: Qwen/Qwen3-0.6B
    dir: Qwen3-0.6B
    params: 0.6e9
    label: Qwen3 0.6B
    no_thinking: true
  q08:
    hf_id: Qwen/Qwen3.5-0.8B
    dir: Qwen3.5-0.8B
    params: 0.8e9
    label: Qwen3.5 0.8B
    no_thinking: true
  q3:
    hf_id: Qwen/Qwen2.5-3B-Instruct
    dir: Qwen2.5-3B-Instruct
    params: 3.09e9
    label: Qwen2.5 3B
  q7:
    hf_id: Qwen/Qwen2.5-7B-Instruct
    dir: Qwen2.5-7B-Instruct
    params: 7.62e9
    label: Qwen2.5 7B
  l8:
    hf_id: meta-llama/Llama-3.1-8B-Instruct
    dir: Llama-3.1-8B-Instruct
    params: 8.03e9
    label: Llama 3.1 8B
  q32:
    hf_id: Qwen/Qwen2.5-32B-Instruct-AWQ
    dir: Qwen2.5-32B-Instruct-AWQ
    params: 32.76e9
    label: Qwen2.5 32B
retrievers:
- key: r05
  model: q05
  train:
    n_train: 60
    epochs: 1
    ckpt_questions:
    - 16
    - 40
    - 60
    n_val: 8
    save_every_questions: 16
    grad_accum: 4
    micro_batch: 2
- key: r06
  model: q06
  train:
    n_train: 60
    epochs: 1
    ckpt_questions:
    - 16
    - 40
    - 60
    n_val: 8
    save_every_questions: 16
    grad_accum: 4
    micro_batch: 2
- key: r08
  model: q08
  train:
    n_train: 60
    epochs: 1
    ckpt_questions:
    - 16
    - 40
    - 60
    n_val: 8
    save_every_questions: 16
    grad_accum: 4
    micro_batch: 2
- key: r3
  model: q3
  train:
    n_train: 60
    epochs: 1
    ckpt_questions:
    - 16
    - 40
    - 60
    n_val: 8
    save_every_questions: 16
    grad_accum: 4
    micro_batch: 2
baseline:
  key: base_q7
  model: q7
  label: Qwen2.5 7B
answerers:
  small:
    model: l8
  big:
    model: q32
  samples: 4
planner: q32
rules:
  rounds: 3
  dev_split_seed: 11
  random_control_draws: 10
  hard:
    H3_max_share_big: 0.6
    H4_max_acc_drop_vs_best_fixed: 0.01
    H5_min_sure_score: 0.85
    H6_max_soft_rules: 8
    H6_min_support_share: 0.02
    H7_max_step: 0.05
    H8_max_compute_per_point: 0.1
  params:
    ret_target: r08
    ret_merge: union
    votes: 2
    sure_threshold: 0.9
  seed_rules:
  - id: H1
    stage: retrieval
    hard: true
    when:
    - - base_conf_pct
      - <
      - 0.1
    then: escalate
    text: IF the cheapest retriever's confidence is in its lowest 10% THEN escalate
      retrieval (locked)
  - id: R1
    stage: retrieval
    when:
    - - base_conf_pct
      - <
      - 0.2
    then: escalate
    to: r08
    text: IF the cheapest retriever's confidence is in its lowest 20% THEN escalate
      to the 0.8B (0.6B skipped) and ensemble
  - id: R2
    stage: retrieval2
    when:
    - - ret_agree
      - ==
      - 0
    - - target_conf_pct
      - <
      - 0.2
    then: escalate
    text: IF after escalating the shortlists disagree AND the bigger retriever is
      also unsure THEN escalate again and ensemble
  - id: H2
    stage: answer
    hard: true
    when:
    - - is_cannot
      - ==
      - 1
    then: escalate
    text: IF the answer is empty or says it cannot be determined THEN escalate (locked)
  - id: A2
    stage: answer
    when:
    - - is_yes_no
      - ==
      - 1
    then: keep
    text: IF the answer is yes/no THEN keep it
  - id: A1
    stage: answer
    when:
    - - is_yes_no
      - ==
      - 0
    - - words_in_passages
      - <
      - 0.97
    then: escalate
    text: IF the answer is not yes/no AND some of its words are not in the passages
      THEN escalate; agree -> accept, else samples vote
  - id: A3
    stage: answer
    when:
    - - words_in_passages
      - '>='
      - 0.97
    - - answer_stated
      - '>'
      - 0.95
    then: keep
    text: IF all its words are in the passages AND stated confidence > 95% THEN keep
      (Sure)
  - id: A4
    stage: answer
    when:
    - - words_in_passages
      - '>='
      - 0.97
    - - answer_stated
      - <=
      - 0.95
    then: keep
    text: IF all its words are in the passages AND stated confidence <= 95% THEN keep
      (borderline)
