# CPU dry run: fake models (backend: mock), a tiny model for fine-tuning, small question sets, all five workstreams.
#   python run.py --config configs/dryrun.yaml --stage all          (about 10-20 minutes)
# Uses the HotpotQA dev file for every set (downloaded once, ~45 MB). Only checks that every stage runs end to end.
include: default.yaml
run_name: dryrun
backend: mock
paths:
  project_dir: ./dryrun_workspace
  data_dir: ${project_dir}/runs/${run_name}/data
progress: {github: false}
data:
  hotpot_train: ${project_dir}/hotpotqa/hotpot_dev_distractor_v1.json
  hotpot_train_url: http://curtis.ml.cmu.edu/datasets/hotpot/hotpot_dev_distractor_v1.json
  n_retrieve: 20
  search_range: [0, 12]
  test_range: [500, 580]
  n_train: 40
  n_val: 6
  n_dev: 160
finetune:
  defaults: {grad_accum: 4, micro_batch: 2, save_every_questions: 20, n_val: 6}
  retrievers:
    q05: {method: lora, n_train: 40, epochs: 1, ckpt_questions: [20, 40]}
    q06: {method: lora, n_train: 40, epochs: 1, ckpt_questions: [20, 40]}
    q08: {method: lora, n_train: 40, epochs: 1, ckpt_questions: [20, 40]}
    q3:  {method: lora, n_train: 40, epochs: 1, ckpt_questions: [20, 40]}
    q7:  {method: lora, n_train: 40, epochs: 1, ckpt_questions: [20, 40]}
    q32: {method: qlora, n_train: 20, epochs: 1, ckpt_questions: [20]}
    q72: {method: qlora, n_train: 20, epochs: 1, ckpt_questions: [20]}
  answerers:
    l3:  {method: lora, n_train: 40, epochs: 1, ckpt_questions: [20, 40]}
    l8:  {method: lora, n_train: 40, epochs: 1, ckpt_questions: [20, 40]}
    l70: {method: qlora, n_train: 20, epochs: 1, ckpt_questions: [20]}
workstreams:
  ws1:
    iterations: 2
    batch_size: 5
    grid:
      retrieval: {q7: [1, 3, 10], q32: [1, 3], q72: [1, 2]}
      answer: {l3: [1, 5, 20, 40], l8: [1, 5, 20], l70: [1, 3, 10]}
rules:
  rounds: 2
  random_control_draws: 4
