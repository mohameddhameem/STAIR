# Jev novelty E5 (docs/gpu-jobs-jev.md): pair D, a weak and a strong model of another family on all 7,405 HotpotQA dev
# questions: Llama-3.2-3B-Instruct on nano-jev's top 2 / Llama-3.1-8B-Instruct on all 10. Everything else is experiment
# 1's configs/gpu.toml (same scorer, prompt, backend), so REUSE=runs/gpu copies its evidence stage.
[scorer]
# nano-jev v1.0 from the Hub (33M MiniLM): relevance per paragraph, sufficiency over the top 2.
kind = "cross-encoder"
path = "sdmlai/nano-jev@v1.0"
sufficiency_top_k = 2
params = 0.033  # billions; reported as scorer_cost, not added to the curves

[[experts]]
name = "small"
kind = "hf"
model = "meta-llama/Llama-3.2-3B-Instruct"
params = 3.21
top_k = 2
dtype = "bfloat16"
batch_size = 32  # runtime-only: lower it on an out-of-memory error and rerun

[[experts]]
name = "large"
kind = "hf"
model = "meta-llama/Llama-3.1-8B-Instruct"
params = 8.03
dtype = "bfloat16"
batch_size = 8
