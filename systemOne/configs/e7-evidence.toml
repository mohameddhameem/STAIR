# Jev novelty E7 (descriptive; pre-registration: "which rankers make cheap evidence plus sampling work"). Experiment 8's
# cheap pipeline, Llama-3.2-3B on 5 pool passages with 1 sample or 20 fused, on the golden set's slr-test (1,481), with
# the passages chosen by four rankers:
#   nanojev  experiment 8's own cells (configs/exp8-slr.toml), reused, never rerun
#   msmarco  cross-encoder/ms-marco-MiniLM-L12-v2: the same 33M architecture, a standard reranker
#   bm25     the pool's BM25 scores: no neural ranker
#   gold     an oracle: both gold paragraphs, then nano-jev's next 3
# Same pools, prompts, sampling seeds (seed + the question's row) and Eq. 8 costs as exp8-slr; each cell pays its own
# ranker's scoring (pool_answer.load_split). The 72B-selection + 70B cell is reused as the strong reference.
#   pools score --out runs/e7-evidence --name test --scorer cross-encoder/ms-marco-MiniLM-L12-v2 --kind reranker --column msmarco
#   pool-answer run --plan configs/e7-evidence.toml --split test [--only <cell>]
#   pool-answer compare --plan configs/e7-evidence.toml --split test --base llama3b-s20fuse-top5
out = "runs/e7-evidence"
seed = 0
agenttts_strong_units = 311   # as exp8-slr (summary only)
reuse_answers = ["runs/exp8-slr/answers/test"]

[[cells]]
name = "llama3b-top5"
model = "meta-llama/Llama-3.2-3B-Instruct"
params = 3.21
top_k = 5
samples = 1
temperature = 0.3
max_new_tokens = 512
batch_size = 16

[[cells]]
name = "llama3b-s20fuse-top5"
model = "meta-llama/Llama-3.2-3B-Instruct"
params = 3.21
top_k = 5
samples = 20
temperature = 0.9
fuse = true
fuse_temperature = 0.3
max_new_tokens = 512
fuse_max_new_tokens = 1024
batch_size = 2

[[cells]]
name = "llama70b-slrprompt-72bsel"  # the strong reference: his Qwen2.5-72B selections, Llama-3.1-70B (reused)
model = "meta-llama/Llama-3.1-70B-Instruct"
params = 70.6
load_in_4bit = true
prompt = "slr"
passages = "slr-72b"
slr_plan = "configs/slr.toml"
top_k = 5
samples = 1
temperature = 0.0
max_new_tokens = 128
batch_size = 8

[[cells]]
name = "llama3b-top5-msmarco"
ranker = "msmarco"
model = "meta-llama/Llama-3.2-3B-Instruct"
params = 3.21
top_k = 5
samples = 1
temperature = 0.3
max_new_tokens = 512
batch_size = 16

[[cells]]
name = "llama3b-top5-bm25"
ranker = "bm25"
model = "meta-llama/Llama-3.2-3B-Instruct"
params = 3.21
top_k = 5
samples = 1
temperature = 0.3
