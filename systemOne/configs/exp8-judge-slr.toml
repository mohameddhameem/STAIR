# Experiment 8 on the HotpotQA golden set (Jonathan's Stage-Level Routing setup; docs/gpu-jobs-slr.md): the System One
# judge choosing among the five answer options of configs/exp8-slr.toml, on the golden-set split, at Table 5 prices.
#   uv run exp8-judge all --plan configs/exp8-judge-slr.toml --exclude runs/exp8/nanojev_validation_ids.txt
out = "runs/exp8-slr"
judge_dir = "judge-5opt"
metric = "lenient_std"            # the standard ruler (stair_common) on each response
cost = "table5"                   # each option's price below, plus nano-jev's ranking call (stair_common.cost.budget)
seeds = [0, 1, 2]
inputs = ["qp", "qpa"]            # qp decides before any answer; qpa also reads the cheapest option's answer (and pays it)
init = "sdmlai/nano-jev@v1.0"
state_k = 5                       # nano-jev passages in the judge's state (the cells read the top 5)
strong_units = 929                # strong-everything at Table 5 prices: 72B retrieval (814) + 70B answering (115)
budget_fraction = 0.25            # RQ8: at most 25% of strong-everything
max_drop = 0.01                   # the "near best" operating point: cheapest within this much of the best calib accuracy
bootstrap = 1000
# AgentTTS's recipe at Table 5 prices under Eq. 8: 72B retrieval (814) + 40 sampled 3B answers from one prompt (42) +
# a 3B fusion call (3, its Table 5 price, as the team slide prices it) = 859. Lenient as re-scored by the team (on its
# own 500 questions: a reference, not a golden-set number).
agenttts_lenient = 0.746
agenttts_units = 859

# Options at Table 5 prices (AgentTTS Table 5-9, Llama-3.2-3B and Llama-3.1-70B HotpotQA answering), cheap to dear.
# Samples from one prompt are one call (Eq. 8): S answers cost budget(3, 256, S x 64); the fusion call is priced as one
# 3B answer.
[[options]]
cell = "llama3b-top5"
label = "small model, one answer"
price = 3

[[options]]
cell = "llama3b-s10fuse-top5"
label = "small model, ten samples fused"
price = 15               # 12 + 3

[[options]]
cell = "llama3b-s20fuse-top5"
label = "small model, twenty samples fused"
price = 25               # 22 + 3

[[options]]
cell = "llama3b-s40fuse-top5"
label = "small model, forty samples fused"
price = 45               # 42 + 3

[[options]]
cell = "llama70b-top5"
label = "large model, one answer"
price = 115

# nano-jev v1.0's own fine-tuning settings, as in configs/system-one.toml
[train]
epochs = 3
lr = 5e-5
weight_decay = 0.01
warmup = 0.06
batch_size = 16
max_length = 512
dev_fraction = 0.1
