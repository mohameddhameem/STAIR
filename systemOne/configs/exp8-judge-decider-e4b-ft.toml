# Experiment 9 (docs/experiment-9-plan.md): Amazon's Strands Decider E4B as the five-option judge of
# experiment 8, fine-tuned, on the graded labels. Everything else is configs/exp8-judge-graded.toml.
#   uv run exp8-judge all --plan configs/exp8-judge-decider-e4b-ft.toml --exclude runs/exp8/nanojev_validation_ids.txt
out = "runs/exp8"
judge_dir = "judge-decider-e4b-ft"
seeds = [0, 1, 2]
inputs = ["qp", "qpa"]            # qp decides before any answer; qpa also reads the cheapest option's answer
init = "StrandsAgents/strands-decider-E4B-gemma4-v1-2610"

metric = "correct"                # LLM grader on the self-committed answer; "commit_em" for its official EM; "lenient" for the old scorer
rescore_dir = "runs/exp8/rescore"
state_k = 5                       # nano-jev passages in the judge's state (the cells read the top 5)
strong_units = 929                # AgentTTS's strong-everything cost: 72B retrieval (814) + 70B answering (115)
budget_fraction = 0.25            # RQ8: at most 25% of strong-everything
max_drop = 0.01                   # the "near best" operating point: cheapest within this much of the best calib accuracy
bootstrap = 1000
# AgentTTS's recipe on its 500 test questions: LENIENT accuracy as re-scored by the team (not comparable with the
# graded metric above; kept for reference only), and its cost
# (about 101% of strong-everything on the team's slide; a lower bound, since its fusion reads ~26k tokens).
agenttts_lenient = 0.746
agenttts_units = 938

# Options, ordered from cheap to expensive (checked against the mean cost on calib: the 70B, about 88 units, sits
# between the 10- and the 20-sample cells).
[[options]]
cell = "llama3b-top5"
label = "small model, one answer"

[[options]]
cell = "llama3b-s10fuse-top5"
label = "small model, ten samples fused"

[[options]]
cell = "llama70b-top5"
label = "large model, one answer"

[[options]]
cell = "llama3b-s20fuse-top5"
label = "small model, twenty samples fused"

[[options]]
cell = "llama3b-s40fuse-top5"
label = "small model, forty samples fused"

# A LoRA + pointer-head fine-tune of the decider: nano-jev's protocol (grouped cross-entropy, best dev epoch),
# with a LoRA-sized learning rate and 2 epochs (the 2B costs ~60x nano-jev per step)
[train]
epochs = 2
lr = 1e-4
weight_decay = 0.01
warmup = 0.06
batch_size = 16
micro_batch = 1     # 4 ran out of memory on an L40S (five passages + five options per item)
max_length = 512   # unused by the decider: it keeps its own window
dev_fraction = 0.1

# The experiment 8 nano-jev judges (graded labels), compared pairwise in the same report
[[reference_judges]]
name = "nano-jev qp"
judge_dir = "judge-5opt-graded"
inputs = "qp"
seeds = [0, 1, 2]
init = "sdmlai/nano-jev@v1.0"

[[reference_judges]]
name = "nano-jev qpa"
judge_dir = "judge-5opt-graded"
inputs = "qpa"
seeds = [0, 1, 2]
init = "sdmlai/nano-jev@v1.0"
