# Experiment 4: gpu.toml with Qwen2.5-14B-Instruct as the large expert (all 10 paragraphs), for a
# wider small-large gap. ~30 GB in bfloat16: fits one 46 GB L40S. Only the large stage differs from
# runs/gpu, so run it with REUSE=runs/gpu (docs/gpu-jobs.md).
[scorer]
# nano-jev v1.0 from the Hub (33M MiniLM): relevance per paragraph, sufficiency over the top 2.
kind = "cross-encoder"
path = "sdmlai/nano-jev@v1.0"
sufficiency_top_k = 2
params = 0.033  # billions; reported as scorer_cost, not added to the curves

[[experts]]
name = "small"
kind = "hf"
model = "Qwen/Qwen2.5-1.5B-Instruct"
params = 1.54
top_k = 2
dtype = "bfloat16"
batch_size = 32  # runtime-only: lower it on an out-of-memory error and rerun

[[experts]]
name = "large"
kind = "hf"
model = "Qwen/Qwen2.5-14B-Instruct"
params = 14.7
dtype = "bfloat16"
batch_size = 4
