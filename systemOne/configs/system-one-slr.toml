# Experiments 7 + 9 on the HotpotQA golden set (Jonathan's Stage-Level Routing setup, stair_common 0.3.0,
# docs/gpu-jobs-slr.md): router_train = slr-train (4,814), calib = slr-val (1,110), test = slr-test (1,481), all dev
# questions, so pair A's caches are cut from runs/gpu's full-dev cache with no model calls (`slr7-prepare`). Labels,
# curves and AIQ use the standard lenient ruler; cost is the golden set's Table 5 price per answering call (Qwen2.5-7B
# 10; Qwen2.5-1.5B 0.5 by the same formula), a judge's own calls priced with stair_common.cost.budget beside it.
#   uv run judge all --plan configs/system-one-slr.toml --out runs/slr-judges
metric = "lenient"
cost = "table5"
tau = 0.5
max_drop = 0.01
seeds = [0, 1, 2]
paired_references = ["judge/qp-large-helps-nanojev-A", "judge/qpa-large-helps-nanojev-A"]
zero_shot_judge = [
  "sdmlai/nano-jev@v1.0",
  "StrandsAgents/strands-decider-2B-hobson-v21",
  "StrandsAgents/strands-decider-E4B-gemma4-v1-2610",
]

[pairs]
A = "runs/slr-pairA"         # 1.5B (top 2) / 7B (all 10): runs/gpu's dev cache, cut to the golden set

[split_data]  # every golden-set split is dev
router_train = "distractor_validation.parquet"
calib = "distractor_validation.parquet"
test = "distractor_validation.parquet"

# nano-jev v1.0's own fine-tuning settings (as configs/system-one.toml)
[train]
epochs = 3
lr = 5e-5
weight_decay = 0.01
warmup = 0.06
batch_size = 16
max_length = 512
dev_fraction = 0.1

# Experiment 7: input ablation, label, and decision pretraining (pair A)
[[judges]]
inputs = "q"
label = "large-helps"
init = "sdmlai/nano-jev@v1.0"
train_pair = "A"

[[judges]]
inputs = "qp"
label = "large-helps"
init = "sdmlai/nano-jev@v1.0"
train_pair = "A"

[[judges]]
inputs = "qpa"
label = "large-helps"
init = "sdmlai/nano-jev@v1.0"
train_pair = "A"

[[judges]]
inputs = "qa"
label = "large-helps"
init = "sdmlai/nano-jev@v1.0"
train_pair = "A"

[[judges]]
inputs = "qp"
label = "small-fails"
init = "sdmlai/nano-jev@v1.0"
train_pair = "A"

[[judges]]
inputs = "qpa"
label = "small-fails"
init = "sdmlai/nano-jev@v1.0"
train_pair = "A"

[[judges]]
inputs = "qp"
label = "large-helps"
init = "cross-encoder/ms-marco-MiniLM-L12-v2"
train_pair = "A"

[[judges]]
inputs = "qpa"
label = "large-helps"
init = "cross-encoder/ms-marco-MiniLM-L12-v2"
train_pair = "A"

# Experiment 9: Strands Decider 2B and E4B, LoRA + pointer head (settings as configs/system-one-decider.toml)
[[judges]]
inputs = "qp"
label = "large-helps"
init = "StrandsAgents/strands-decider-2B-hobson-v21"
train_pair = "A"
train = { epochs = 2, lr = 1e-4, micro_batch = 4 }

[[judges]]
inputs = "qpa"
label = "large-helps"
init = "StrandsAgents/strands-decider-2B-hobson-v21"
train_pair = "A"
train = { epochs = 2, lr = 1e-4, micro_batch = 4 }

[[judges]]
inputs = "qp"
label = "large-helps"
init = "StrandsAgents/strands-decider-E4B-gemma4-v1-2610"
train_pair = "A"
train = { epochs = 2, lr = 1e-4, micro_batch = 2 }

[[judges]]
inputs = "qpa"
label = "large-helps"
init = "StrandsAgents/strands-decider-E4B-gemma4-v1-2610"
train_pair = "A"
train = { epochs = 2, lr = 1e-4, micro_batch = 2 }
